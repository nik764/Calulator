<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="darkred">
    <u>
    <h1 style="text-align: center;">CALCULATOR</h1></u>
    <b>Addition</b><br><br>
    <form oninput="result.value=parseInt(num1.value)+parseInt(num2.value)">
        <input type="number" id="num1" placeholder="Enter first number"><br>+<br>
        <input type="number" id="num2" placeholder="Enter second number"><br>=<br>
        <output name="result" id="result" for="num1 num2"></output>
</form>
    <b>Substraction</b><br><br>
    <form oninput="result.value=parseInt(num1.value)-parseInt(num2.value)">
        <input type="number" id="num1" placeholder="Enter first number"><br>-<br>
        <input type="number" id="num2" placeholder="Enter second number"><br>=<br>
        <output name="result" id="result" for="num1 num2"></output>
    </form>    
    <b>Multiplication</b><br><br>
    <form oninput="result.value=parseInt(num1.value)/parseInt(num2.value)">
        <input type="number" id="num1" placeholder="Enter first number"><br>/<br>
        <input type="number" id="num2" placeholder="Enter second number"><br>=<br>
        <output name="result" id="result" for="num1 num2"></output>
    </form>
    <b>Multiplication</b><br><br>
    <form oninput="result.value=parseInt(num1.value)*parseInt(num2.value)">
        <input type="number" id="num1" placeholder="Enter first number"><br>*<br>
        <input type="number" id="num2" placeholder="Enter second number"><br>=<br>
        <output name="result" id="result" for="num1 num2"></output>
    </form>
</body>
</html>
